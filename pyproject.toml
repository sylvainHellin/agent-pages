[project]
name = "agent-pages"
version = "0.1.0"
description = "An HTML page template and reader app that lets you comment on and answer your AI agent's reports and lessons."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
agent-pages = "agent_pages.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"
